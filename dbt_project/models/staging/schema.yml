version: 2

models:
  - name: stg_optn_waitlist
    description: "OPTN/UNOS waiting list, normalized to unified long contract."
    columns:
      - name: source
        tests: [{accepted_values: {values: [OPTN]}}, not_null]
      - name: country_iso3
        tests: [{accepted_values: {values: [USA]}}, not_null]
      - name: metric_type
        tests: [{accepted_values: {values: [stock, additions, removals]}}, not_null]
      - name: organ
        tests:
          - not_null
          - accepted_values:
              values: [kidney, liver, heart, lung, pancreas, kidney_pancreas, heart_lung, intestine, vca]
      - name: patients
        tests: [not_null]

  - name: stg_eurotransplant_waitlist
    description: "Eurotransplant waiting list (active waitlist report only for MVP)."
    columns:
      - name: source
        tests: [{accepted_values: {values: [Eurotransplant]}}, not_null]
      - name: country_iso3
        tests:
          - not_null
          - accepted_values:
              values: [AUT, BEL, HRV, DEU, HUN, ITA, LUX, NLD, SVN]
      - name: metric_type
        tests: [{accepted_values: {values: [stock, additions, removals]}}, not_null]
      - name: year
        tests: [not_null]
      - name: organ
        tests:
          - not_null
          - accepted_values:
              values: [kidney, liver, heart, lung, pancreas]
      - name: patients
        tests: [not_null]

  - name: stg_nhsbt_waitlist
    description: "NHS Blood and Transplant waitlist — UK fiscal year-end snapshot by organ."
    columns:
      - name: source
        tests: [{accepted_values: {values: [NHSBT]}}, not_null]
      - name: country_iso3
        tests: [{accepted_values: {values: [GBR]}}, not_null]
      - name: metric_type
        tests: [{accepted_values: {values: [stock]}}, not_null]
      - name: year
        tests: [not_null]
      - name: organ
        tests:
          - not_null
          - accepted_values:
              values: [kidney, liver, heart, lung, pancreas, intestine]
      - name: patients
        tests: [not_null]

  - name: stg_ont_waitlist
    description: "ONT España waitlist — calendar year-end active patients by organ (kidney, heart, liver, lung)."
    columns:
      - name: source
        tests: [{accepted_values: {values: [ONT]}}, not_null]
      - name: country_iso3
        tests: [{accepted_values: {values: [ESP]}}, not_null]
      - name: metric_type
        tests: [{accepted_values: {values: [stock]}}, not_null]
      - name: year
        tests: [not_null]
      - name: organ
        tests:
          - not_null
          - accepted_values:
              values: [kidney, liver, heart, lung]
      - name: patients
        tests: [not_null]

  - name: stg_cenatra_waitlist
    description: "CENATRA México waiting list — quarterly snapshots, state × organ."
    columns:
      - name: source
        tests: [{accepted_values: {values: [CENATRA]}}, not_null]
      - name: country_iso3
        tests: [{accepted_values: {values: [MEX]}}, not_null]
      - name: region_code
        tests: [not_null]
      - name: metric_type
        tests: [{accepted_values: {values: [stock]}}, not_null]
      - name: year
        tests: [not_null]
      - name: quarter
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false
      - name: organ
        tests:
          - not_null
          - accepted_values:
              values: [kidney, liver, heart, lung, pancreas, kidney_pancreas, heart_lung, cornea, bone_marrow, intestine, vca, other_tissue]
      - name: patients
        tests: [not_null]
