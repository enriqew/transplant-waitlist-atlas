[project]
name = "transplant-waitlist-atlas"
version = "0.1.0"
description = "Offline data pipeline: organ-transplant waiting lists from multiple national registries (CENATRA, OPTN, NHS BT, ONT, Eurotransplant, Scandiatransplant, ANZDATA), unified into static JSON artifacts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Enrique Redonda" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "dbt-duckdb>=1.9.0",
    "dbt-core>=1.9.0",
    # Pin mashumaro: dbt-adapters 1.23 caps it at <3.18, while versions <3.16
    # don't support Python 3.14's typing changes (Optional resolution breaks
    # JSONObjectSchema in mashumaro<3.16). Keep within [3.16, 3.18).
    "mashumaro[msgpack]>=3.16,<3.18",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "requests>=2.32.0",
    "pdfplumber==0.11.4",
    "python-slugify>=8.0.4",
    "jsonschema>=4.23.0",
    "click>=8.1.7",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingest*", "export*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
